name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-only-insecure-secret-key' }}
      DB_HOST: 127.0.0.1
      DB_PORT: "55432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'apppassword' }}
      DB_SSLMODE: require
      LLM_API_URL: https://provider.invalid/v1/chat/completions
      LLM_MODEL: test-model
      LLM_API_KEY: ""
      EMBEDDING_API_URL: https://provider.invalid/v1/embeddings
      EMBEDDING_MODEL: test-embedding-model
      EMBEDDING_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dashboard.txt
            requirements-performance-dashboard.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --no-cache .

      - name: Generate PostgreSQL TLS certificates
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/server.key \
            -out certs/server.crt \
            -days 1 \
            -subj "/CN=localhost"

      - name: Start PostgreSQL
        run: |
          docker rm -f ci-postgres || true
          docker run -d \
            --name ci-postgres \
            -p 55432:5432 \
            -e POSTGRES_DB="$DB_NAME" \
            -e POSTGRES_USER="$DB_USER" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -v "${{ github.workspace }}/certs:/tls-source:ro" \
            -v "${{ github.workspace }}/scripts/postgres-ssl-entrypoint.sh:/scripts/postgres-ssl-entrypoint.sh:ro" \
            --entrypoint /bin/sh \
            postgres:16-alpine \
            /scripts/postgres-ssl-entrypoint.sh postgres \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
            -c ssl_key_file=/var/lib/postgresql/tls/server.key

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U "$DB_USER" -d "$DB_NAME"; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-postgres
          exit 1

      - name: Run migrations
        run: python app/manage.py migrate --noinput

      - name: Run tests
        run: |
          mkdir -p reports
          pytest -v \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=0

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-postgres || true

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: test-and-lint
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PostgreSQL TLS certificates
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/server.key \
            -out certs/server.crt \
            -days 1 \
            -subj "/CN=localhost"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and dashboard images
        run: docker compose build api dashboard

      - name: Start infrastructure
        run: docker compose up -d --wait --wait-timeout 180 db redis kafka

      - name: Initialize Kafka topics
        run: docker compose run --rm kafka-init

      - name: Run migrations
        run: docker compose run --rm api python app/manage.py migrate --noinput

      - name: Validate RAG command
        run: docker compose run --rm api python app/manage.py ingest_docs --help

      - name: Start API and dashboard
        run: docker compose up -d --wait --no-deps --wait-timeout 120 api dashboard

      - name: Validate HTTP endpoints
        run: |
          curl -fsS http://localhost:8000/openapi.yaml > /dev/null
          curl -fsS http://localhost:8501/_stcore/health

      - name: Validate service communication
        run: |
          docker compose exec -T api python app/manage.py shell -c \
            "from django.db import connection; connection.ensure_connection(); print('api-db-ok')"
          docker compose exec -T dashboard python -c \
            "from app.inventory.database import engine; from sqlalchemy import text; connection = engine.connect(); print(connection.execute(text('SELECT 1')).scalar()); connection.close(); print('dashboard-db-ok')"
          docker compose exec -T dashboard python -c \
            "import urllib.request; print(urllib.request.urlopen('http://api:8000/openapi.yaml', timeout=10).status); print('dashboard-api-ok')"

      - name: Dump Compose logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 > compose-logs.txt
          docker compose logs --no-color

      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Stop Compose
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: Publish API image
    runs-on: ubuntu-latest
    needs:
      - test-and-lint
      - compose-validation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/synapseshop-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/synapseshop-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
